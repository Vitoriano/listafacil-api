services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      # 3000-3002 já estão em uso por outros projetos nesta máquina
      - '3003:3000'
    env_file:
      - .env
    environment:
      # DATABASE_URL vem do .env (banco de dev no Neon). Redis interno da rede do compose.
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      # node_modules isolado: após mudar package.json rode `docker compose build api` e suba de novo,
      # ou remova o volume do serviço api (o CMD do Dockerfile.dev roda `npm ci` para alinhar deps).
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      # 6380 no host para não colidir com um Redis local na 6379
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
