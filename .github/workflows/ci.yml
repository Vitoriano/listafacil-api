name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      # Não bloqueante por enquanto: o código tem erros de lint pré-existentes
      # (regras de type-safety). Remova o continue-on-error quando zerar.
      - name: Lint
        run: npm run lint:check
        continue-on-error: true

      - name: Unit tests
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build
